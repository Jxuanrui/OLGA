name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .[test]
      - name: Unit / regression tests
        run: pytest tests/ -v
      - name: Pack + behaviour self-check
        run: olga verify
      - name: CLI end-to-end smoke
        run: |
          olga run --genes FUT2,MCM6,LCT --out /tmp/smoke
          grep -P "^FUT2\t" /tmp/smoke/chains.tsv | awk -F'\t' '$8=="cell_type_confirmed"{found=1} END{exit !found}'
