[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "olga"
version = "0.1.2"
description = "Oligogenic Locus-resolved Genetic Attribution: cell-type attribution stage of the OLGA framework for microbiome GWAS"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "anndata>=0.10",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
olga = "olga.cli:main"

[tool.setuptools]
packages = ["olga"]

[tool.setuptools.package-data]
olga = ["data/*.json", "data/celltype_refs/*/*"]
